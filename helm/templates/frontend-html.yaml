    async function testSource(id) {
      const data = await apiFetch('/api/v1/sources/' + id + '/test', { method: 'POST' });
      if (data) {
        showToast(data.reachable ? '✅ Source reachable' : '❌ Source unreachable', data.reachable ? 'green' : 'red');
        await loadSources();
      }
