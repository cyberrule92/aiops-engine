      await apiFetch('/api/v1/sources/' + id, { method: 'DELETE' });
      await loadSources();
    }
    
    // ─────────────────────────────────────────────
    // METRICS / CHARTS
    // ─────────────────────────────────────────────
    async function runQuery() {
      const query = document.getElementById('promql-input').value.trim();
      if (!query) return;
    
      document.getElementById('chart-title').textContent = query;
      document.getElementById('chart-empty').style.display = 'none';
    
      const range = document.getElementById('metrics-range').value;
      const now = Math.floor(Date.now() / 1000);
      const rangeMap = { '1h': 3600, '3h': 10800, '6h': 21600, '24h': 86400 };
      const delta = rangeMap[range] || 3600;
      const step = Math.max(60, Math.floor(delta / 200)) + 's';
    
      const data = await apiFetch(`/api/v1/metrics/query_range?query=${encodeURIComponent(query)}&start=${now - delta}&end=${now}&step=${step}`);
    
      if (!data || !data.result?.length) {
        document.getElementById('chart-empty').style.display = 'flex';
        document.getElementById('chart-meta').textContent = 'No data';
        return;
      }
    
      renderChart(data.result, query);
    }
    
    function renderChart(series, title) {
      const ctx = document.getElementById('metric-chart').getContext('2d');
    
      if (state.chartInstance) state.chartInstance.destroy();
    
      const colors = ['#00d4ff','#00e676','#b388ff','#ffb300','#ff6d00','#ff1744'];
    
      const datasets = series.slice(0, 8).map((s, i) => {
        const pts = s.values || [];
        return {
          label: JSON.stringify(s.metric).slice(0, 60),
          data: pts.map(p => ({ x: p[0] * 1000, y: parseFloat(p[1]) })),
          borderColor: colors[i % colors.length],
          backgroundColor: colors[i % colors.length] + '15',
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
          tension: 0.3,
        };
      });
    
      state.chartInstance = new Chart(ctx, {
        type: 'line',
        data: { datasets },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              type: 'time',
              ticks: { color: '#4a5568', font: { family: 'IBM Plex Mono', size: 9 } },
              grid: { color: '#1e2a3a' },
            },
            y: {
              ticks: { color: '#4a5568', font: { family: 'IBM Plex Mono', size: 9 } },
              grid: { color: '#1e2a3a' },
            },
          },
          plugins: {
            legend: {
              labels: { color: '#8b949e', font: { family: 'IBM Plex Mono', size: 9 }, boxWidth: 10 },
            },
          },
        },
      });
    
      document.getElementById('chart-meta').textContent = series.length + ' series';
    }
    
    function renderMetricsList(metrics) {
      const el = document.getElementById('metrics-list');
      if (!metrics.length) {
        el.innerHTML = '<div class="text-muted text-xs" style="padding:8px;">No metrics (connect Prometheus first)</div>';
        return;
      }
      el.innerHTML = metrics.map(m => `
        <span class="tag" style="cursor:pointer;" onclick="document.getElementById('promql-input').value='${m}';">${m}</span>`).join('');
    }
    
    function filterMetrics() {
      const q = document.getElementById('metrics-search').value.toLowerCase();
      const filtered = state.metrics.filter(m => m.toLowerCase().includes(q));
      renderMetricsList(filtered);
    }
    
    // ─────────────────────────────────────────────
    // RCA FLOW
    // ─────────────────────────────────────────────
    function openRCAModal() {
      document.getElementById('rca-modal').classList.add('open');
      document.getElementById('rca-modal-body').innerHTML = `
        <div class="form-row">
          <label class="form-label">Correlation Group ID (optional)</label>
          <input class="form-input" id="rca-group-id" placeholder="Leave blank to use recent alerts">
        </div>
        <div class="form-row">
          <label class="form-label">Extra Context (optional)</label>
          <input class="form-input" id="rca-context" placeholder="e.g. deployment at 14:30, node drain scheduled">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
          <button class="btn btn-ghost" onclick="closeRCAModal()">Cancel</button>
          <button class="btn btn-primary" onclick="generateRCA()">⚡ Analyze with Ollama</button>
        </div>`;
    }
    
    function closeRCAModal() {
      document.getElementById('rca-modal').classList.remove('open');
    }
    
    async function generateRCA() {
      const groupId = document.getElementById('rca-group-id')?.value?.trim();
      const body = { alert_ids: [], anomaly_ids: [], correlation_group_id: groupId || null };
    
      document.getElementById('rca-modal-body').innerHTML = `
        <div class="loading-spinner">
          <div class="spinner"></div>
          <div>Analyzing with Ollama LLM…</div>
          <div class="mono text-xs text-dim">This may take 30-60 seconds</div>
        </div>`;
    
      const data = await apiFetch('/api/v1/rca/generate', { method: 'POST', body: JSON.stringify(body) });
      closeRCAModal();
    
      if (data) {
        showToast('✅ RCA generated!', 'green');
        await loadRCA();
        showTab('rca');
      } else {
        showToast('❌ RCA generation failed', 'red');
      }
    }
    
    async function generateRCAForGroup(groupId) {
      const data = await apiFetch('/api/v1/rca/generate', {
        method: 'POST',
        body: JSON.stringify({ alert_ids: [], anomaly_ids: [], correlation_group_id: groupId }),
      });
      if (data) {
        showToast('✅ RCA generated!', 'green');
        await loadRCA();
        showTab('rca');
      }
    }
    
    async function runRCAForAlert(alertId) {
      const data = await apiFetch('/api/v1/rca/generate', {
        method: 'POST',
        body: JSON.stringify({ alert_ids: [alertId], anomaly_ids: [] }),
      });
      if (data) { showToast('✅ RCA generated!', 'green'); await loadRCA(); }
    }
    
    async function runRCAForAnomaly(anomalyId) {
      const data = await apiFetch('/api/v1/rca/generate', {
        method: 'POST',
        body: JSON.stringify({ alert_ids: [], anomaly_ids: [anomalyId] }),
      });
      if (data) { showToast('✅ RCA generated!', 'green'); await loadRCA(); }
    }
    
    async function triggerCorrelation() {
      // Just reload after a short delay (correlation runs on background schedule)
      showToast('⚙️ Correlation triggered…', 'blue');
      setTimeout(async () => { await loadCorrelations(); showToast('✅ Correlation complete', 'green'); }, 3000);
    }
    
    // ─────────────────────────────────────────────
    // ALERT DETAIL
    // ─────────────────────────────────────────────
    async function showAlertDetail(id) {
      const data = await apiFetch('/api/v1/alerts/' + id);
      if (!data) return;
      const el = document.getElementById('alert-modal-body');
      el.innerHTML = `
        <div class="mb-3">
          <div class="flex items-center gap-2 mb-2">
            <span class="sev-badge sev-${data.severity}">${data.severity}</span>
            <span class="tag ${data.status === 'firing' ? 'color-red' : 'color-green'}">${data.status}</span>
            <span class="tag">${data.source_type}</span>
          </div>
          <div style="font-size:15px;font-weight:600;margin-bottom:4px;">${data.name}</div>
          ${data.annotations?.description ? `<div class="text-dim text-sm">${data.annotations.description}</div>` : ''}
        </div>
        <div class="divider"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
          <div><div class="form-label">Namespace</div><div class="mono text-sm">${data.namespace || '—'}</div></div>
          <div><div class="form-label">Service</div><div class="mono text-sm">${data.service || '—'}</div></div>
          <div><div class="form-label">Node</div><div class="mono text-sm">${data.node || '—'}</div></div>
          <div><div class="form-label">Started</div><div class="mono text-sm">${fmtTime(data.starts_at)}</div></div>
        </div>
        ${data.labels ? `<div class="form-label">Labels</div><div class="tag-list">${Object.entries(data.labels).map(([k,v])=>`<span class="tag"><span style="color:var(--text-3)">${k}=</span>${v}</span>`).join('')}</div>` : ''}
        <div class="divider"></div>
        <button class="btn btn-primary btn-sm" onclick="runRCAForAlert('${data.id}');document.getElementById('alert-modal').classList.remove('open')">🧠 Generate RCA</button>`;
      document.getElementById('alert-modal').classList.add('open');
    }
    
    // ─────────────────────────────────────────────
    // SIDEBAR FILTER
    // ─────────────────────────────────────────────
    function filterSeverity(severity, el) {
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      state.activeFilter = severity;
      renderAlertsPage();
    }
    
    // ─────────────────────────────────────────────
    // LIVE FEED
    // ─────────────────────────────────────────────
    function addFeedEvent(text, color) {
      feedEvents.push({ text, color });
      if (feedEvents.length > 30) feedEvents = feedEvents.slice(-30);
      renderFeed();
    }
    
    function renderFeed() {
      const el = document.getElementById('feed-inner');
      const doubled = [...feedEvents, ...feedEvents];
      el.innerHTML = doubled.map(e => `
        <span class="feed-event">
          <span class="dot" style="background:${e.color};box-shadow:0 0 4px ${e.color}"></span>
          ${e.text}
        </span>`).join('');
    }
    
    // ─────────────────────────────────────────────
    // SSE REAL-TIME
    // ─────────────────────────────────────────────
    function connectSSE() {
      const alertES = new EventSource(API + '/api/v1/alerts/stream');
      alertES.onmessage = (e) => {
        try {
          const alert = JSON.parse(e.data);
          // Add if not exists
          if (!state.alerts.find(a => a.id === alert.id)) {
            state.alerts.unshift(alert);
            if (state.alerts.length > 500) state.alerts.pop();
          }
          updateAlertCounts();
          renderDashboardAlerts();
          addFeedEvent(`[${alert.severity?.toUpperCase()}] ${alert.name} | ${alert.namespace || 'N/A'}`, alert.severity === 'critical' ? 'var(--red)' : alert.severity === 'warning' ? 'var(--yellow)' : 'var(--accent)');
    
          // Flash new row if on alerts page
          const tbody = document.getElementById('alerts-page-body');
          renderAlertsPage();
        } catch(e) {}
      };
      alertES.onerror = () => setTimeout(connectSSE, 5000);
    
      const anomalyES = new EventSource(API + '/api/v1/anomalies/stream');
      anomalyES.onmessage = (e) => {
        try {
          const an = JSON.parse(e.data);
          if (!state.anomalies.find(a => a.id === an.id)) {
            state.anomalies.unshift(an);
            if (state.anomalies.length > 500) state.anomalies.pop();
          }
          renderDashboardAnomalies();
          document.getElementById('sb-anomalies').textContent = state.anomalies.length;
          document.getElementById('kpi-anomalies').textContent = state.anomalies.length;
          addFeedEvent(`ANOMALY ${an.metric_name} score=${an.score?.toFixed(2)} dev=${an.deviation_pct > 0 ? '+' : ''}${an.deviation_pct?.toFixed(1)}%`, 'var(--yellow)');
        } catch(e) {}
      };
      anomalyES.onerror = () => setTimeout(() => {}, 5000);
    }
    
    // ─────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────
    function scoreBar(score) {
      const pct = Math.round((score || 0) * 100);
      const color = score >= 0.8 ? 'var(--red)' : score >= 0.6 ? 'var(--yellow)' : 'var(--green)';
      return `<div class="score-bar-wrap">
        <div class="score-bar"><div class="score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="score-val mono" style="color:${color}">${score?.toFixed(2)}</span>
      </div>`;
    }
    
    function confidenceRing(conf) {
      const pct = Math.round((conf || 0) * 100);
      const r = 16;
      const circ = 2 * Math.PI * r;
      const dash = (conf || 0) * circ;
      const color = conf >= 0.75 ? 'var(--green)' : conf >= 0.5 ? 'var(--yellow)' : 'var(--red)';
      return `<div class="confidence-ring">
        <svg width="44" height="44" viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--bg-3)" stroke-width="3"/>
          <circle cx="22" cy="22" r="${r}" fill="none" stroke="${color}" stroke-width="3"
            stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
            stroke-linecap="round"
            transform="rotate(-90 22 22)"/>
        </svg>
        <div class="conf-text">${pct}%</div>
      </div>`;
    }
    
    function fmtTime(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        const now = Date.now();
        const diff = Math.floor((now - d.getTime()) / 1000);
        if (diff < 60)   return diff + 's ago';
        if (diff < 3600) return Math.floor(diff/60) + 'm ago';
        if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
        return d.toLocaleDateString();
      } catch(e) { return iso; }
    }
    
    // Toast notifications
    let toastTimer;
    function showToast(msg, type = 'green') {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.style.cssText = `position:fixed;top:20px;right:20px;padding:10px 18px;border-radius:6px;font-family:var(--font-mono);font-size:11px;z-index:9999;transition:all .2s;border:1px solid;`;
        document.body.appendChild(el);
      }
      const colors = {
        green:  ['rgba(0,230,118,.15)','var(--green)','rgba(0,230,118,.3)'],
        red:    ['rgba(255,23,68,.15)', 'var(--red)', 'rgba(255,23,68,.3)'],
        yellow: ['rgba(255,179,0,.12)','var(--yellow)','rgba(255,179,0,.3)'],
        blue:   ['rgba(0,212,255,.1)', 'var(--accent)','rgba(0,212,255,.25)'],
      };
      const [bg, fg, border] = colors[type] || colors.green;
      el.style.background = bg;
      el.style.color = fg;
      el.style.borderColor = border;
      el.textContent = msg;
      el.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 3000);
    }
    
    // ─────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────
    
    // Load Chart.js and adapter
    function loadScript(src, cb) {
      const s = document.createElement('script');
      s.src = src;
      s.onload = cb;
      document.head.appendChild(s);
    }
    
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js', () => {
      loadScript('https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js', () => {
        console.log('Chart.js loaded');
      });
    });
    
    // Bootstrap
    (async function init() {
      await refreshAll();
      connectSSE();
      // Periodic refresh every 30s
      setInterval(refreshAll, 30000);
    
      // Demo feed events
      addFeedEvent('AIOps Engine started — waiting for events', 'var(--green)');
      addFeedEvent('Connect Prometheus/OTEL sources to begin ingestion', 'var(--accent)');
    })();
    </script>
    </body>
    </html>
