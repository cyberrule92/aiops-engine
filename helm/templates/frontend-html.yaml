    async function connectPrometheus() {
      const name = document.getElementById('prom-name').value;
      const endpoint = document.getElementById('prom-url').value;
      const data = await apiFetch('/api/v1/sources', {
        method: 'POST',
        body: JSON.stringify({ name, source_type: 'prometheus', endpoint }),
      });
      if (data) {
        showToast(data.status === 'ok' ? '✅ Prometheus connected!' : '⚠️ Connected (check endpoint)', data.status === 'ok' ? 'green' : 'yellow');
        await loadSources();
      }
    }
    
    async function connectOTEL() {
      const name = document.getElementById('otel-name').value;
      const endpoint = document.getElementById('otel-http-url').value;
      const data = await apiFetch('/api/v1/sources', {
        method: 'POST',
        body: JSON.stringify({ name, source_type: 'otel', endpoint }),
      });
      if (data) {
        showToast(data.status === 'ok' ? '✅ OTEL Collector connected!' : '⚠️ Connected (check endpoint)', data.status === 'ok' ? 'green' : 'yellow');
        await loadSources();
      }
    }
    
