    function renderAnomaliesPage() {
      const search = document.getElementById('anom-search')?.value?.toLowerCase() || '';
      const minScore = parseFloat(document.getElementById('anom-score-filter')?.value || 0) / 100;
      const tbody = document.getElementById('anomalies-page-body');
    
      let filtered = state.anomalies;
