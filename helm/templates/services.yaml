{{- /* ─── Services ─── */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-engine.fullname" . }}-backend
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "aiops-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-engine.fullname" . }}-frontend
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "aiops-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.service.frontendPort }}
      targetPort: http
      protocol: TCP
---
{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-engine.fullname" . }}-ollama
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "aiops-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP
{{- end }}
---
{{- /* ─── ConfigMap: Backend env ─── */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops-engine.fullname" . }}-config
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.backend.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  OLLAMA_BASE_URL: "http://{{ include "aiops-engine.fullname" . }}-ollama:11434"
---
{{- /* ─── ConfigMap: Nginx config ─── */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops-engine.fullname" . }}-nginx
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API calls to backend
        location /api/ {
            proxy_pass http://{{ include "aiops-engine.fullname" . }}-backend:{{ .Values.service.backendPort }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # SSE support
        location /api/v1/alerts/stream {
            proxy_pass http://{{ include "aiops-engine.fullname" . }}-backend:{{ .Values.service.backendPort }};
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
---
{{- /* ─── PVC: SQLite data ─── */}}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aiops-engine.fullname" . }}-data
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
{{- /* ─── PVC: Ollama model storage ─── */}}
{{- if and .Values.ollama.enabled .Values.ollama.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aiops-engine.fullname" . }}-ollama
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.ollama.persistence.storageClass }}
  storageClassName: {{ .Values.ollama.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
{{- end }}
---
{{- /* ─── ServiceAccount ─── */}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aiops-engine.serviceAccountName" . }}
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- /* ─── RBAC ─── */}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiops-engine.fullname" . }}
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "nodes", "namespaces", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aiops-engine.fullname" . }}
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aiops-engine.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aiops-engine.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
{{- /* ─── Ingress ─── */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aiops-engine.fullname" . }}
  labels: {{- include "aiops-engine.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls: {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aiops-engine.fullname" . }}-frontend
                port:
                  number: {{ .Values.service.frontendPort }}
{{- end }}
---
{{- /* ─── HPA ─── */}}
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aiops-engine.fullname" . }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aiops-engine.fullname" . }}-backend
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- /* ─── PodDisruptionBudget ─── */}}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aiops-engine.fullname" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "aiops-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
{{- end }}
