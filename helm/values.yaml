# ─────────────────────────────────────────────────────────────────
# AIOps Engine — Helm Values
# ─────────────────────────────────────────────────────────────────

replicaCount: 2

image:
  repository: your-registry/aiops-engine
  tag: "1.0.0"
  pullPolicy: IfNotPresent

frontend:
  image:
    repository: nginx
    tag: "alpine"
    pullPolicy: IfNotPresent

# ── Backend config ─────────────────────────────────────────────────
backend:
  env:
    PROMETHEUS_URL: "http://prometheus-operated:9090"
    ALERTMANAGER_URL: "http://alertmanager-operated:9093"
    OTEL_HTTP_ENDPOINT: "http://otel-collector:4318"
    OLLAMA_BASE_URL: "http://ollama:11434"
    OLLAMA_MODEL: "llama3"
    ANOMALY_DETECTION_INTERVAL: "60"
    CORRELATION_WINDOW_SECONDS: "300"
    ZSCORE_THRESHOLD: "3.0"
    ISOLATION_FOREST_CONTAMINATION: "0.05"
    MIN_ANOMALY_SCORE: "0.6"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# ── Ollama (local LLM, air-gapped) ─────────────────────────────────
ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: "latest"
  model: "llama3"
  resources:
    requests:
      cpu: "2000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  persistence:
    enabled: true
    size: "50Gi"
    storageClass: ""       # leave blank for default
  # GPU support — uncomment if GPU nodes available
  # nodeSelector:
  #   accelerator: nvidia
  # tolerations:
  #   - key: nvidia.com/gpu
  #     operator: Exists
  #     effect: NoSchedule
  # resources:
  #   limits:
  #     nvidia.com/gpu: 1

# ── Persistence (SQLite data volume) ───────────────────────────────
persistence:
  enabled: true
  size: "10Gi"
  storageClass: ""

# ── Service ─────────────────────────────────────────────────────────
service:
  type: ClusterIP
  backendPort: 8000
  frontendPort: 80

# ── Ingress ─────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  host: aiops.example.com
  tls: []

# ── ServiceAccount ──────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── RBAC (needed to watch K8s events) ───────────────────────────────
rbac:
  create: true

# ── Autoscaling ─────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ── Pod disruption budget ────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Network Policy ──────────────────────────────────────────────────
networkPolicy:
  enabled: false

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
